name = "lendon-telegram-bridge"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV namespace lưu hàng đợi lệnh lên đơn.
# Tạo bằng: npx wrangler kv namespace create ORDERS
# Rồi dán "id" nhận được vào dưới đây.
[[kv_namespaces]]
binding = "ORDERS"
id = "d190cc4379b14679bd826d619f25cd9d"

# Biến bí mật KHÔNG đặt ở đây (tránh lộ). Đặt bằng:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put TG_SECRET
#   npx wrangler secret put PULL_SECRET
#   npx wrangler secret put ALLOWED_CHAT_IDS   (tùy chọn)
