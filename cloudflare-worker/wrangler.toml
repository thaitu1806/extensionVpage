name = "lendon-telegram-bridge"
main = "worker.js"
compatibility_date = "2025-03-01"

# Create once: npx wrangler queues create vpage-order-commands
[[queues.producers]]
binding = "ORDERS_QUEUE"
queue = "vpage-order-commands"

[[queues.consumers]]
queue = "vpage-order-commands"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5

[[durable_objects.bindings]]
name = "COMMANDS"
class_name = "CommandHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CommandHub"]

# Keep existing secrets: BOT_TOKEN, TG_SECRET, PULL_SECRET; ALLOWED_CHAT_IDS optional.
